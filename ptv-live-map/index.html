<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ptv-live-map</title>
  </head>
  <body>
<div id="controls">
  <div id="route-picker">
    <button id="route-picker-toggle" type="button">
      <span id="route-picker-toggle-label">All vehicles (near me)</span>
      <span id="route-picker-chevron" aria-hidden="true">&#9662;</span>
    </button>
    <div id="route-picker-panel">
      <div id="route-picker-header">
        <span>Routes</span>
        <button id="route-picker-close" type="button" aria-label="Close">&times;</button>
      </div>
      <input type="text" id="route-search" placeholder="Search routes" />
      <div id="mode-tabs"></div>
      <div id="route-list"></div>
    </div>
  </div>
</div>
<div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
