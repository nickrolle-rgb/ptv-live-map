<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ptv-live-map</title>
  </head>
  <body>
<div id="controls">
  <div id="route-picker">
    <button id="route-picker-toggle" type="button">
      <span id="route-picker-toggle-label">All vehicles (near me)</span>
      <span id="route-picker-chevron" aria-hidden="true">&#9662;</span>
    </button>
    <div id="route-picker-panel">
      <div id="route-picker-header">
        <span id="route-picker-heading">Nearby</span>
        <button id="route-picker-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="panel-tabs">
        <button type="button" class="panel-tab active" data-pane="discovery">Nearby</button>
        <button type="button" class="panel-tab" data-pane="routes">Routes</button>
        <button type="button" class="panel-tab" data-pane="journey">Journey</button>
      </div>
      <div id="panel-viewport">
        <div id="panel-track">
          <div id="discovery-pane" class="panel-pane"></div>
          <div id="routes-pane" class="panel-pane">
            <div id="route-search-wrap">
              <input type="text" id="route-search" placeholder="Search routes" />
              <button type="button" id="route-search-clear" aria-label="Clear search">&times;</button>
            </div>
            <div id="mode-tabs"></div>
            <div id="route-list"></div>
          </div>
          <div id="journey-pane" class="panel-pane">
            <div id="journey-origin-row"></div>
            <div id="journey-time-row">
              <select id="journey-time-mode">
                <option value="now">Leave now</option>
                <option value="depart">Leave at</option>
                <option value="arrive">Arrive by</option>
              </select>
              <input type="time" id="journey-time-input" />
            </div>
            <div id="journey-search-wrap">
              <input type="text" id="journey-search" placeholder="Search a destination stop" />
              <button type="button" id="journey-search-clear" aria-label="Clear search">&times;</button>
            </div>
            <div id="journey-hint">or tap the map to drop a destination pin</div>
            <div id="journey-results"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="ride-prompt" role="status" aria-live="polite">
    <div id="ride-prompt-text"></div>
    <div id="ride-prompt-caveat"></div>
    <div id="ride-prompt-actions">
      <button id="ride-prompt-yes" type="button">Yes</button>
      <button id="ride-prompt-no" type="button">No</button>
    </div>
  </div>
</div>
<div id="app"></div>
<div id="map-loading">
  <div id="map-loading-spinner"></div>
</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
